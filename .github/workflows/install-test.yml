# Install a published release on fresh systems and start it once (tools/smoke-test.py), so a package that's
# missing a dependency or breaks on another distribution shows up before users find it.
# Runs for every published release, or by hand: Actions → Install test → Run workflow (empty = latest release).
# With "source" ticked it builds unsigned packages from the chosen commit instead, to try a fix before releasing.
name: Install test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to test, e.g. 1.0.0 (empty: the latest release)"
        required: false
      source:
        description: "Build the packages from this commit instead of downloading a release"
        type: boolean
        default: false

jobs:
  install:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            kind: deb
          - image: ubuntu:22.04   # Linux Mint 21 is built on it
            kind: deb
          - image: debian:12
            kind: deb
          - image: fedora:latest
            kind: rpm
    steps:
      # The page sandbox and Fedora's image loaders run in bubblewrap, which needs user namespaces. A desktop allows
      # them; GitHub's Ubuntu host restricts them, so lift that before starting the container.
      - name: Allow user namespaces like a desktop does
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: actions/checkout@v4

      - name: Install and start Arrow on ${{ matrix.image }}
        run: >
          docker run --rm --privileged -v "$PWD:/src"
          -e KIND=${{ matrix.kind }} -e REPO=${{ github.repository }}
          -e WANT=${{ github.event.release.tag_name || inputs.version }} -e SOURCE=${{ inputs.source || false }}
          ${{ matrix.image }} bash /src/.github/install-test.sh
